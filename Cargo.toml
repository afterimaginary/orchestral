[package]
name = "orchestral"
version = "0.1.0"
edition = "2024"
description = "A small workflow layer for Claude Code: plan the work, run a fleet of workers, respect the budget."
license = "MIT"
repository = "https://github.com/afterimaginary/orchestral"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
jiff = { version = "0.2.38", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
yaml_serde = "0.10.7"

[dev-dependencies]
tempfile = "3.27.0"
