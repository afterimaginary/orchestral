# Runs the project's verify suite on GitHub-hosted macOS and Ubuntu runners for every
# PR head. The final `verify` job passes only when both platforms pass, so a merge can
# require that one check.
name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The tests make commits in temporary repositories; hosted runners have no git identity.
  GIT_AUTHOR_NAME: verify
  GIT_AUTHOR_EMAIL: verify@example.com
  GIT_COMMITTER_NAME: verify
  GIT_COMMITTER_EMAIL: verify@example.com

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: make verify

  verify:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success
